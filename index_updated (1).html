    // ---------------------------

    function fmt(dtIso){

    function uid(prefix="R"){

    async function fileToDataUrl(file){
      return new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = ()=>resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function haversineMeters(lat1, lon1, lat2, lon2){
      if([lat1,lon1,lat2,lon2].some(v => typeof v !== "number" || Number.isNaN(v))) return Infinity;
      const R = 6371000;
      const toRad = (x)=>x*Math.PI/180;
      const dLat = toRad(lat2-lat1);
      const dLon = toRad(lon2-lon1);
      const a =
        Math.sin(dLat/2)**2 +
        Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R*c;
    }

    function tokenize(s){
      return (s || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean);
    }

    // Jaccard similarity over word sets (simple + effective for demo)
    function textSimilarity(a,b){
      const A = new Set(tokenize(a));
      const B = new Set(tokenize(b));
      if(A.size === 0 && B.size === 0) return 1;
      if(A.size === 0 || B.size === 0) return 0;
      let inter = 0;
      for(const w of A){ if(B.has(w)) inter++; }
      const union = A.size + B.size - inter;
      return union === 0 ? 0 : inter/union;
    }

    // ---------------------------
    // Teachable Machine helpers
    // ---------------------------
    let _issueModelPromise = null;
    async function loadIssueModel(){
      if(_issueModelPromise) return _issueModelPromise;
      _issueModelPromise = window.tmImage.load(TM_ISSUE_URL+"model.json", TM_ISSUE_URL+"metadata.json");
      return _issueModelPromise;
    }

    // If your TM labels already match category names, mapping is direct.
    function mapIssueLabelToCategory(label){
      const norm = (label||"").toLowerCase();
      // direct match
      for(const c of CATEGORIES){
        if(c.toLowerCase() === norm) return c;
      }
      // loose matches
      if(norm.includes("pothole")) return "Pothole";
      if(norm.includes("street") && norm.includes("light")) return "Streetlight";
      if(norm.includes("garbage") || norm.includes("trash") || norm.includes("waste")) return "Garbage";
      if(norm.includes("water") || norm.includes("leak")) return "Water";
      if(norm.includes("safety") || norm.includes("hazard") || norm.includes("accident")) return "Safety";
      if(norm.includes("other") || norm.includes("unknown") || norm.includes("none")) return "Other";
      return null;
    }

    async function predictIssueFromFile(file){
      const model = await loadIssueModel();
      const img = new Image();
      img.src = await fileToDataUrl(file);
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
      const preds = await model.predict(img);
      const sorted = [...preds].sort((a,b)=>b.probability-a.probability);
      const top = sorted[0] || { className: "Unknown", probability: 0 };
      return {
        topLabel: top.className,
        topConfidence: top.probability,
        topCategory: mapIssueLabelToCategory(top.className),
        all: sorted.slice(0,3).map(p=>({label:p.className, confidence:p.probability}))
      };
    }

    let _faceModelPromise = null;
    async function loadFaceModel(){
      if(_faceModelPromise) return _faceModelPromise;
      _faceModelPromise = window.tmImage.load(TM_GOV_FACE_URL+"model.json", TM_GOV_FACE_URL+"metadata.json");
      return _faceModelPromise;
    }

    function isFaceLabelAllowed(label){

      return !(norm.includes("unknown") || norm.includes("other") || norm.includes("none") || norm.includes("background"));

    function useTechnicians(){
      const [techs, setTechs] = useState(()=>loadLS(STORAGE.technicians, DEFAULT_TECHNICIANS));

      useEffect(()=>saveLS(STORAGE.technicians, techs), [techs]);

      const findAvailable = (dept)=>{
        const list = techs[dept] || [];
        return list.find(t=>t.available) || null;
      };

      const assign = (dept, reportId)=>{
        const t = findAvailable(dept);
        if(!t) return null;
        setTechs(prev=>({
          ...prev,
          [dept]: (prev[dept]||[]).map(x => x.id===t.id ? {...x, available:false, currentTask: reportId} : x)
        }));
        return t;
      };

      const release = (dept, techId)=>{
        setTechs(prev=>({
          ...prev,
          [dept]: (prev[dept]||[]).map(x => x.id===techId ? {...x, available:true, currentTask:null} : x)
        }));
      };

      return { techs, setTechs, findAvailable, assign, release };
    }

    function CitizenView({reports, setReports, settings, setToast}){
      const [profile, setProfile] = useState(()=>loadLS(STORAGE.publicProfile, {name:"", phone:""}));
      const [photoFile, setPhotoFile] = useState(null);
      const [photoPreview, setPhotoPreview] = useState("");
      const [category, setCategory] = useState("Pothole");
      const [description, setDescription] = useState("");
      const [priority, setPriority] = useState("Medium");
      const [lat, setLat] = useState("");
      const [lng, setLng] = useState("");

      // AI issue recognition state
      const [ai, setAi] = useState({loading:false, top:null, preds:[], err:""});

      useEffect(()=>saveLS(STORAGE.publicProfile, profile), [profile]);

      async function captureLocation(){
        if(!navigator.geolocation){
          setToast("Geolocation not supported in this browser.");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos)=>{
            setLat(pos.coords.latitude.toFixed(6));
            setLng(pos.coords.longitude.toFixed(6));
            setToast("Location captured.");
          },
          ()=>{
            setToast("Location permission denied.");
          },
          { enableHighAccuracy:true, timeout: 10000 }
        );
      }

      async function handlePhotoChange(e){
        const f = e.target.files?.[0] || null;
        setPhotoFile(f);
        setAi({loading:false, top:null, preds:[], err:""});
        if(!f){ setPhotoPreview(""); return; }
        setPhotoPreview(await fileToDataUrl(f));

        // Run AI issue recognition
        setAi(s=>({...s, loading:true, err:""}));
        try{
          const res = await predictIssueFromFile(f);
          setAi({loading:false, top:{label:res.topLabel, conf:res.topConfidence, cat:res.topCategory}, preds:res.all, err:""});
          if(res.topCategory && res.topConfidence >= settings.issueAutoFillThreshold){
            setCategory(res.topCategory);
            if(!description.trim()){
              setDescription(`Auto-detected: ${res.topLabel} (${Math.round(res.topConfidence*100)}%).`);
            }
          }
        }catch(err){
          console.error(err);
          setAi({loading:false, top:null, preds:[], err:"AI recognition failed. Try another photo."});
        }
      }

      function findDuplicateCandidate(newReport){
        const radM = settings.duplicateRadiusMeters;
        const textTh = settings.duplicateTextSimilarity;

        let best = null;
        for(const r of reports){
          if(r.status === "Resolved") continue;
          if(r.category !== newReport.category) continue;

          const d = haversineMeters(
            Number(newReport.lat), Number(newReport.lng),
            Number(r.lat), Number(r.lng)
          );

          const sim = textSimilarity(newReport.description, r.description);

          const isDup = (d <= radM) || (sim >= textTh);
          if(!isDup) continue;

          // Score: closer + more similar
          const score = (Math.max(0, (radM - d)) / radM) + sim;
          if(!best || score > best.score){
            best = { report: r, d, sim, score };
          }
        }
        return best;
      }

      async function submitReport(){
        if(!profile.name.trim()){
          setToast("Please enter your name.");
          return;
        }
        if(!description.trim()){
          setToast("Please enter a description.");
          return;
        }
        if(!lat || !lng){
          setToast("Please capture location (or enter lat/lng).");
          return;
        }

        const id = uid("TKT");
        const now = new Date().toISOString();

          createdAt: now,
          reporterName: profile.name.trim(),
          reporterPhone: profile.phone.trim(),
          category,
          department: CATEGORY_TO_DEPT[category] || "General",
          description: description.trim(),

          aiIssue: ai?.top ? { label: ai.top.label, confidence: ai.top.conf } : null,
          updates: [{ at: now, status: "New", note: "Reported by citizen" }]
        };

        // Duplicate check
        const dup = findDuplicateCandidate(report);
        if(dup){
          const msg =
            `Similar issue found (Ticket ${dup.report.id}).\n` +
            `Distance: ${dup.d === Infinity ? "N/A" : Math.round(dup.d)}m, Similarity: ${Math.round(dup.sim*100)}%\n\n` +
            `Upvote existing instead of creating new?`;
          const upvote = window.confirm(msg);
          if(upvote){
            setReports(prev=>prev.map(r=>r.id===dup.report.id
              ? ({...r, upvotes:(r.upvotes||0)+1, updates:[...r.updates, {at: now, status:r.status, note:`Upvoted by ${profile.name}`}]})
              : r
            ));
            pushNotification({
              type:"government",
              reportId: dup.report.id,
              at: now,
              message: `Ticket ${dup.report.id} got an upvote (category: ${dup.report.category}).`
            });
            setToast("Upvoted the existing issue.");
            return;
          }
          // else continue to create new
        }

        setReports(prev=>[report, ...prev]);
        setToast("Report submitted.");
        // reset
        setDescription("");
        setPhotoFile(null);
        setPhotoPreview("");
        setAi({loading:false, top:null, preds:[], err:""});
      }

      const myTickets = useMemo(()=>{
        // show tickets created by this user (best-effort match)
        const n = (profile.name||"").trim().toLowerCase();
        return reports.filter(r => (r.reporterName||"").trim().toLowerCase() === n);
      }, [reports, profile.name]);

      return (
        <div className="max-w-5xl mx-auto p-6 space-y-6">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="text-2xl font-bold">Citizen</div>
              <div className="text-sm text-slate-600">Report an issue, upvote duplicates, and track your tickets.</div>
            </div>
          </div>

          <div className="bg-white border border-slate-200 shadow-sm card p-6">
            <SectionTitle title="Create a report" subtitle="Upload photo, location, and details. AI can auto-suggest the category." />

            <div className="grid sm:grid-cols-2 gap-4">
              <div>
                <label className="text-sm font-medium">Your name</label>
                <input className="mt-1 w-full border rounded-xl px-3 py-2"
                       value={profile.name}
                       onChange={(e)=>setProfile(p=>({...p, name:e.target.value}))}
                       placeholder="e.g., Mageshwar" />
              </div>
              <div>
                <label className="text-sm font-medium">Phone (optional)</label>
                <input className="mt-1 w-full border rounded-xl px-3 py-2"
                       value={profile.phone}
                       onChange={(e)=>setProfile(p=>({...p, phone:e.target.value}))}
                       placeholder="+91..." />
              </div>
            </div>

            <div className="grid sm:grid-cols-3 gap-4 mt-4">
              <div>
                <label className="text-sm font-medium">Category</label>
                <select className="mt-1 w-full border rounded-xl px-3 py-2"
                        value={category}
                        onChange={(e)=>setCategory(e.target.value)}>
                  {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="text-sm font-medium">Priority</label>
                <select className="mt-1 w-full border rounded-xl px-3 py-2"
                        value={priority}
                        onChange={(e)=>setPriority(e.target.value)}>
                  <option>Low</option>
                  <option>Medium</option>
                  <option>High</option>
                </select>
              </div>
              <div>
                <label className="text-sm font-medium">Photo</label>
                <input type="file" accept="image/*" className="mt-1 w-full"
                       onChange={handlePhotoChange} />
              </div>
            </div>

            {photoPreview && (
              <div className="mt-3 grid sm:grid-cols-2 gap-3">
                <img src={photoPreview} alt="preview" className="w-full max-h-64 object-cover rounded-2xl border" />
                <div className="rounded-2xl border p-4 bg-slate-50">
                  <div className="font-semibold">AI suggestion</div>
                  {ai.loading && <div className="text-sm text-slate-600 mt-2">Analyzing…</div>}
                  {ai.err && <div className="text-sm text-rose-600 mt-2">{ai.err}</div>}
                  {ai.top && (
                    <div className="mt-2 text-sm">
                      <div>Top: <span className="font-medium">{ai.top.cat || ai.top.label}</span> ({Math.round(ai.top.conf*100)}%)</div>
                      <div className="mt-2 space-y-1">
                        {ai.preds.map((p,i)=>(
                          <div key={i} className="flex items-center justify-between">
                            <div className="text-slate-700">{p.label}</div>
                            <div className="text-slate-500">{Math.round(p.confidence*100)}%</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="text-xs text-slate-500 mt-3">
                    Auto-fill threshold: {Math.round(settings.issueAutoFillThreshold*100)}%
                  </div>
                </div>
              </div>
            )}

            <div className="mt-4">
              <label className="text-sm font-medium">Description</label>
              <textarea className="mt-1 w-full border rounded-xl px-3 py-2 min-h-[90px]"
                        value={description}
                        onChange={(e)=>setDescription(e.target.value)}
                        placeholder="Describe the issue clearly…" />
            </div>

            <div className="grid sm:grid-cols-3 gap-4 mt-4">
              <div>
                <label className="text-sm font-medium">Latitude</label>
                <input className="mt-1 w-full border rounded-xl px-3 py-2"
                       value={lat}

                <button onClick={submitReport} className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800">

          </div>

          <div className="bg-white border border-slate-200 shadow-sm card p-6">
            <SectionTitle title="My tickets" subtitle="Tickets reported with your name (best-effort match)." />
            {myTickets.length === 0 ? (

    function GovernmentLogin({settings, onLoggedIn, setToast}){
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const [status, setStatus] = useState("Camera off");
      const [scanning, setScanning] = useState(false);
      const [last, setLast] = useState(null); // {label, conf}

      async function startCamera(){
        try{
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:"user" }, audio:false });
          streamRef.current = stream;
          if(videoRef.current){
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          }
          setStatus("Camera ready");
        }catch(e){
          console.error(e);
          setStatus("Camera blocked");
          setToast("Camera permission denied.");
        }
      }

      function stopCamera(){
        if(streamRef.current){
          streamRef.current.getTracks().forEach(t=>t.stop());
          streamRef.current = null;
        }
        setStatus("Camera off");
      }

      async function scanAndLogin(){
        if(!videoRef.current){
          setToast("Camera not ready.");
          return;
        }
        setScanning(true);
        setStatus("Loading model…");
        try{
          const model = await loadFaceModel();
          setStatus("Scanning…");
          const preds = await model.predict(videoRef.current);
          const sorted = [...preds].sort((a,b)=>b.probability-a.probability);
          const top = sorted[0] || { className:"Unknown", probability:0 };
          setLast({label: top.className, conf: top.probability});

          if(isFaceLabelAllowed(top.className) && top.probability >= settings.faceLoginThreshold){
            const prof = { label: top.className, confidence: top.probability, at: new Date().toISOString() };
            saveLS(STORAGE.govProfile, prof);
            setStatus("Login success");
            setToast("Government login successful.");
            onLoggedIn(prof);
          }else{
            setStatus("Face not recognized");
            setToast("Face not recognized. Try again.");
          }
        }catch(e){
          console.error(e);
          setStatus("Scan failed");
          setToast("Face scan failed.");
        }finally{
          setScanning(false);
        }
      }

      return (
        <div className="max-w-3xl mx-auto p-6">
          <div className="bg-white border border-slate-200 shadow-sm card p-6">
            <SectionTitle title="Government Login" subtitle="Use face recognition to access the dashboard." />
            <div className="grid sm:grid-cols-2 gap-4 items-start">
              <div>
                <video ref={videoRef} className="w-full rounded-2xl border bg-black" playsInline muted />
                <div className="text-xs text-slate-500 mt-2">Status: {status}</div>
                {last && (
                  <div className="text-sm mt-2">
                    Last: <span className="font-medium">{last.label}</span> ({Math.round(last.conf*100)}%)
                  </div>
                )}
              </div>
              <div className="space-y-3">
                <div className="rounded-2xl border p-4 bg-slate-50 text-sm">
                  <div className="font-semibold">How it works</div>
                  <div className="text-slate-600 mt-1">
                    Start camera → Scan & Login. If any trained class matches your face with enough confidence, you are logged in.
                  </div>
                  <div className="text-xs text-slate-500 mt-2">
                    Threshold: {Math.round(settings.faceLoginThreshold*100)}%
                  </div>
                </div>
                <div className="flex gap-2 flex-wrap">
                  <button onClick={startCamera} className="px-4 py-2 rounded-xl border bg-white hover:bg-slate-50">Start camera</button>
                  <button disabled={scanning} onClick={scanAndLogin} className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-60">
                    {scanning ? "Scanning…" : "Scan & Login"}
                  </button>
                  <button onClick={stopCamera} className="px-4 py-2 rounded-xl border bg-white hover:bg-slate-50">Stop</button>
                </div>
                <button onClick={()=>{ stopCamera(); onLoggedIn(null); }} className="text-sm underline text-slate-600">Back</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

      useEffect(()=>{
        const on = ()=>{ /* trigger rerender by changing state? easiest via toast noop */ setTab(t=>t); };
        window.addEventListener("fixcity-notif", on);
        return ()=>window.removeEventListener("fixcity-notif", on);
      }, []);

      const filtered = useMemo(()=>{
        return reports.filter(r=>{
          if(filter.status !== "All" && r.status !== filter.status) return false;
          if(filter.dept !== "All" && r.department !== filter.dept) return false;
          return true;
        });
      }, [reports, filter]);

      const stats = useMemo(()=>{
        const s = { New:0, Assigned:0, "In Progress":0, "Pending Review":0, Resolved:0 };
        for(const r of reports){ s[r.status] = (s[r.status]||0)+1; }
        return s;
      }, [reports]);

      function updateReport(id, updater){
        setReports(prev=>prev.map(r=>r.id===id ? updater(r) : r));
      }

      async function assignNow(r){
        const now = new Date().toISOString();
        const tech = techApi.assign(r.department, r.id);
        if(!tech){
          setToast("No free technician available for this department.");
          return;
        }

        updateReport(r.id, (x)=>({
          ...x,
          status: "Assigned",
          assignedTechId: tech.id,
          assignedTechName: tech.name,
          updates: [...x.updates, { at: now, status:"Assigned", note:`Assigned to technician ${tech.name} (${tech.id})` }]
        }));

        pushNotification({
          type:"technician",
          technicianId: tech.id,
          reportId: r.id,
          at: now,
          message: `New task assigned: ${r.category} (${r.department}). Ticket ${r.id}.`
        });

        // SMS trigger
        await sendTechnicianSMS(settings, tech, { ...r, id: r.id });

      function approve(r){
        const now = new Date().toISOString();

        updateReport(r.id, (x)=>({
          ...x,
          status: "Resolved",
          rejectReason: "",
          updates: [...x.updates, { at: now, status:"Resolved", note:"Approved by government" }]

        pushNotification({ type:"citizen", reportId:r.id, at: now, message:`Your ticket ${r.id} has been approved and marked resolved.` });
        setToast("Approved and resolved.");

      function reject(r){
        const reason = prompt("Rejection reason (required):");

        pushNotification({ type:"technician", reportId:r.id, at: now, message:`Ticket ${r.id} was rejected. Reason: ${reason.trim()}` });

      const [completionPreview, setCompletionPreview] = useState("");

      const myTask = useMemo(()=>{
        if(!techProfile?.currentTask) return null;
        return reports.find(r=>r.id===techProfile.currentTask) || null;
      }, [reports, techProfile]);

      const myNotifs = useMemo(()=>{
        const all = loadLS(STORAGE.notifications, []);
        return all.filter(n=>n.type==="technician" && (!n.technicianId || n.technicianId===techProfile?.id)).slice(0,30);
      }, [reports, techProfile?.id]);

      async function handleCompletionPhoto(e){
        const f = e.target.files?.[0] || null;
        setCompletionFile(f);
        if(!f){ setCompletionPreview(""); return; }
        setCompletionPreview(await fileToDataUrl(f));
      }

      function setStatus(id, status, note){
        const now = new Date().toISOString();
        setReports(prev=>prev.map(r=>r.id===id ? ({
          ...r,
          status,
          updates:[...r.updates, { at: now, status, note }]
        }) : r));
      }

      function completeTask(){
        if(!myTask){ setToast("No assigned task."); return; }
        if(!completionPreview){ setToast("Upload completion photo first."); return; }
        const now = new Date().toISOString();

        setReports(prev=>prev.map(r=>r.id===myTask.id ? ({
          ...r,
          status: "Pending Review",
          completionPhoto: completionPreview,
          updates:[...r.updates, { at: now, status:"Pending Review", note:`Work completed by ${techProfile.name} (${techProfile.id})` }]
        }) : r));

        pushNotification({
          type:"government",
          reportId: myTask.id,
          at: now,
          message: `Ticket ${myTask.id} marked completed by ${techProfile.name}. Pending review.`
        });

        setToast("Marked as Pending Review.");
      }

      function logout(){
        saveLS(STORAGE.techProfile, null);
        setToast("Logged out.");
        window.location.reload();
      }

      return (
        <div className="max-w-6xl mx-auto p-6 space-y-6">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="text-2xl font-bold">Technician</div>
              <div className="text-sm text-slate-600">{techProfile.name} ({techProfile.id}) • {techProfile.department}</div>
            </div>
            <button onClick={logout} className="px-4 py-2 rounded-xl border bg-white hover:bg-slate-50">Logout</button>
          </div>

          <div className="bg-white border border-slate-200 shadow-sm card p-6">
            <SectionTitle title="Assigned Task" subtitle="Update status and submit completion photo for review." />
            {!myTask ? (
              <div className="text-sm text-slate-600">No task assigned currently.</div>
            ) : (
              <div className="border rounded-2xl p-4">
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <div className="font-semibold">{myTask.category} • {myTask.department}</div>
                    <div className="text-sm text-slate-700 mt-1">{myTask.description}</div>
                    <div className="text-xs text-slate-500 mt-2">{myTask.id} • {fmt(myTask.createdAt)}</div>
                  </div>
                  <div className="flex flex-col items-end gap-2">
                    <Badge tone={myTask.priority==="High"?"red":myTask.priority==="Medium"?"yellow":"slate"}>{myTask.priority}</Badge>
                    <Badge tone={myTask.status==="Pending Review"?"purple":myTask.status==="In Progress"?"yellow":myTask.status==="Assigned"?"blue":"slate"}>{myTask.status}</Badge>
                  </div>
                </div>

                {myTask.photo && <img src={myTask.photo} className="mt-3 w-full max-h-72 object-cover rounded-2xl border" alt="task" />}

                <div className="mt-4 flex flex-wrap gap-2">
                  {myTask.status==="Assigned" && (
                    <button onClick={()=>setStatus(myTask.id, "In Progress", `Work started by ${techProfile.name}`)}
                            className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800">
                      Start work
                    </button>
                  )}
                  {myTask.status==="In Progress" && (
                    <div className="flex flex-wrap items-end gap-2">
                      <div>
                        <label className="text-sm font-medium">Completion photo</label>
                        <input type="file" accept="image/*" className="mt-1 w-full" onChange={handleCompletionPhoto} />
                      </div>
                      <button onClick={completeTask} className="px-4 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700">
                        Mark completed (Pending Review)
                      </button>
                    </div>
                  )}
                </div>

                {completionPreview && (
                  <img src={completionPreview} className="mt-3 w-full max-h-72 object-cover rounded-2xl border" alt="completion" />
                )}
              </div>
            )}
          </div>

          <div className="bg-white border border-slate-200 shadow-sm card p-6">
            <SectionTitle title="Notifications" subtitle="New tasks and review feedback." />
            {myNotifs.length===0 ? (
              <div className="text-sm text-slate-600">No notifications.</div>
            ) : (
              <div className="space-y-2">
                {myNotifs.map(n=>(
                  <div key={n.id} className="border rounded-2xl p-3">
                    <div className="text-sm">{n.message}</div>
                    <div className="text-xs text-slate-500 mt-1">{fmt(n.at)} • {n.reportId || ""}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---------------------------
    // App
    // ---------------------------
    function App(){
      const [role, setRole] = useState(null);
      const [toast, setToast] = useState("");

      const [settings, setSettings] = useState(()=>({
        ...DEFAULT_SETTINGS,
        ...loadLS(STORAGE.settings, {})
      }));

      useEffect(()=>saveLS(STORAGE.settings, settings), [settings]);

      const [reports, setReports] = useState(()=>loadLS(STORAGE.reports, []));

      useEffect(()=>saveLS(STORAGE.reports, reports), [reports]);

      const techApi = useTechnicians();

      // Restore sessions
      const [govProfile, setGovProfile] = useState(()=>loadLS(STORAGE.govProfile, null));
      const [techProfile, setTechProfile] = useState(()=>loadLS(STORAGE.techProfile, null));

      // Auto-assign on new report submission (optional but useful)
      useEffect(()=>{
        // If a report is New and we have free technician, assign automatically.
        // This keeps demo lively even without government intervention.
        const newest = reports[0];
        if(!newest || newest.status !== "New") return;
        // Only auto-assign if it's truly fresh (created within 15s)
        const age = Date.now() - new Date(newest.createdAt).getTime();
        if(age > 15000) return;

        const tech = techApi.assign(newest.department, newest.id);
        if(!tech) return;

        const now = new Date().toISOString();
        setReports(prev=>prev.map(r=>r.id===newest.id ? ({
          ...r,
          status:"Assigned",
          assignedTechId: tech.id,
          assignedTechName: tech.name,
          updates:[...r.updates, {at: now, status:"Assigned", note:`Auto-assigned to ${tech.name} (${tech.id})` }]
        }) : r));

        pushNotification({ type:"technician", technicianId: tech.id, reportId: newest.id, at: now, message: `New auto-assigned task: ${newest.category} (${newest.department}). Ticket ${newest.id}.` });

        // SMS trigger
        sendTechnicianSMS(settings, tech, newest);

        setToast(`Auto-assigned to ${tech.name}`);
      }, [reports.length]); // run when a report is added

      function resetAll(){
        if(!confirm("Reset all local data?")) return;
        localStorage.removeItem(STORAGE.reports);
        localStorage.removeItem(STORAGE.notifications);
        localStorage.removeItem(STORAGE.publicProfile);
        localStorage.removeItem(STORAGE.govProfile);
        localStorage.removeItem(STORAGE.techProfile);
        localStorage.removeItem(STORAGE.technicians);
        localStorage.removeItem(STORAGE.settings);
        window.location.reload();
      }

      return (
        <div>
          <div className="bg-white border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-2xl bg-slate-900"></div>
                <div>
                  <div className="font-bold">FixCity</div>
                  <div className="text-xs text-slate-500">Civic Issue Reporter</div>
                </div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={()=>setRole(null)} className="px-3 py-2 rounded-xl border bg-white hover:bg-slate-50">Home</button>
                <button onClick={resetAll} className="px-3 py-2 rounded-xl border bg-white hover:bg-slate-50">Reset</button>
              </div>
            </div>
          </div>

          {!role && <RolePicker onPick={setRole} />}

          {role==="citizen" && (
            <CitizenView
              reports={reports}
              setReports={setReports}
              settings={settings}
              setToast={setToast}
            />
          )}

          {role==="government" && (
            govProfile ? (
              <GovernmentView
                reports={reports}
                setReports={setReports}
                techApi={techApi}
                settings={settings}
                setSettings={setSettings}
                setToast={setToast}
              />
            ) : (
              <GovernmentLogin
                settings={settings}
                onLoggedIn={(prof)=>{
                  if(prof===null){
                    setRole(null);
                    return;
                  }
                  setGovProfile(prof);
                }}
                setToast={setToast}
              />
            )
          )}

          {role==="technician" && (
            techProfile ? (
              <TechnicianView
                reports={reports}
                setReports={setReports}
                techApi={techApi}
                techProfile={techProfile}
                setToast={setToast}
              />
            ) : (
              <TechnicianLogin
                techApi={techApi}
                onLoggedIn={(prof)=>{
                  if(prof===null){ setRole(null); return; }
                  setTechProfile(prof);
                }}
                setToast={setToast}
              />
            )
          )}

          <Toast toast={toast} onClose={()=>setToast("")} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
