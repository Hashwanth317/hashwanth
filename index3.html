    async function fileToDataUrl(file){return new Promise((res)=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}
    // Resize/compress a data URL (image) to reduce size before storing in localStorage
    async function resizeDataUrl(dataUrl, maxWidth=1024, quality=0.75){
      return new Promise((res,rej)=>{
        try{
          const img = new Image();
          img.onload = ()=>{
            const ratio = Math.min(1, maxWidth / img.width);
            const w = Math.round(img.width * ratio);
            const h = Math.round(img.height * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img,0,0,w,h);
            const out = canvas.toDataURL('image/jpeg', quality);
            res(out);
          };
          img.onerror = (e)=>rej(e);
          img.src = dataUrl;
        }catch(e){rej(e)}
      })
    }
    
    // --- AI Issue Recognition (Teachable Machine, runs in browser) ---
    const TM_ISSUE_URL = "https://teachablemachine.withgoogle.com/models/KzgVgXErL/";
    let _tmIssueModelPromise = null;

    async function loadIssueModel(){
      if(_tmIssueModelPromise) return _tmIssueModelPromise;
      _tmIssueModelPromise = (async ()=>{
        if(!window.tmImage){
          throw new Error("tmImage not found. Check teachablemachine-image script tag.");
        }
        const modelURL = TM_ISSUE_URL + "model.json";
        const metadataURL = TM_ISSUE_URL + "metadata.json";
        return await window.tmImage.load(modelURL, metadataURL);
      })();
      return _tmIssueModelPromise;
    }

    function _normKey(s){
      return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    }

    function mapLabelToCategory(label){
      const k = _normKey(label);

      // If your Teachable Machine class names match app categories, this works automatically:
      try{
        const direct = (typeof CATEGORIES !== "undefined")
          ? CATEGORIES.find(c => _normKey(c) === k)
          : null;
        if(direct) return direct;
      }catch(e){}

      // Numeric/class mapping (e.g., "class 1" -> Garbage, "class 2" -> Pothole)
      if(k === "1" || k.includes("class 1") || k.includes("class_1") || k.includes("class-1")) return "Garbage";
      if(k === "2" || k.includes("class 2") || k.includes("class_2") || k.includes("class-2")) return "Pothole";

      // Fallback keyword mapping (handles labels like "Street Light", "Trash", "Water leak")
      if(k.includes("pothole")) return "Pothole";
      if(k.includes("street") && k.includes("light")) return "Streetlight";
      if(k.includes("garbage") || k.includes("trash") || k.includes("waste")) return "Garbage";
      if(k.includes("water") || k.includes("leak")) return "Water";
      if(k.includes("safety") || k.includes("hazard") || k.includes("accident")) return "Safety";
      if(k.includes("other")) return "Other";

      return null;
    }

    async function fileToHtmlImage(file){
      const dataUrl = await fileToDataUrl(file);
      const img = new Image();
      img.src = dataUrl;
      await new Promise((res, rej)=>{
        img.onload = res;
        img.onerror = rej;
      });
      return img;
    }

    async function recognizeIssueFromFile(file){
      const model = await loadIssueModel();
      const img = await fileToHtmlImage(file);
      const preds = await model.predict(img); // [{className, probability}, ...]
      preds.sort((a,b)=>b.probability - a.probability);
      const top = preds[0] || {className:"Unknown", probability:0};
      return {
        label: top.className,
        confidence: top.probability,
        category: mapLabelToCategory(top.className),
        all: preds
      };
    }

      const stats=useMemo(()=>{const byStatus=Object.fromEntries(STATUS_FLOW.map(s=>[s,0]));const byCat=Object.fromEntries(CATEGORIES.map(c=>[c,0]));const byDept=Object.values(DEPARTMENTS).reduce((a,d)=>(a[d]=0,a),{});let ratingSum=0,ratingCount=0;allReports.forEach(r=>{byStatus[r.status]=(byStatus[r.status]||0)+1;byCat[r.category]=(byCat[r.category]||0)+1;byDept[r.department]=(byDept[r.department]||0)+1;if(r.review&&typeof r.review.rating==="number"){ratingSum+=r.review.rating;ratingCount+=1}});return{byStatus,byCat,byDept,total:allReports.length,avgRating:ratingCount?(ratingSum/ratingCount):0,ratingCount}},[allReports]);
      return(<div className="space-y-6"><div className="grid lg:grid-cols-5 gap-4"><StatCard title="Total Reports" value={stats.total} icon={<AlertIcon/>}/><StatCard title="Submitted" value={stats.byStatus['Submitted']} icon={<ClockIcon/>}/><StatCard title="In Progress" value={stats.byStatus['In Progress']} icon={<WrenchIcon/>}/><StatCard title="Resolved" value={stats.byStatus['Resolved']} icon={<CheckIcon/>}/><div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4"><div className="flex items-center gap-2 text-slate-600 text-sm"><StarIcon className="text-amber-500"/> Avg Rating</div><div className="text-2xl font-semibold mt-1 flex items-baseline gap-1">{stats.avgRating.toFixed(1)}<span className="text-xs text-slate-500">({stats.ratingCount})</span></div></div></div>
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4"><div className="flex flex-col sm:flex-row gap-3 sm:items-end sm:justify-between"><div><h3 className="font-semibold mb-1">Incoming Reports</h3><p className="text-sm text-slate-500">Filter, select, and advance status. Auto‑routing suggests department based on category. Ratings appear after resolution.</p></div><div className="flex flex-wrap gap-2"><FilterSelect label="Category" value={filters.category} onChange={(v)=>setFilters(f=>({...f,category:v}))} options={["",...CATEGORIES]}/><FilterSelect label="Status" value={filters.status} onChange={(v)=>setFilters(f=>({...f,status:v}))} options={["",...STATUS_FLOW]}/><FilterSelect label="Priority" value={filters.priority} onChange={(v)=>setFilters(f=>({...f,priority:v}))} options={["",...PRIORITIES]}/><button onClick={bulkAdvance} disabled={selection.length===0} className="inline-flex items-center gap-2 px-3 py-2 rounded-xl border"><WrenchIcon/> Advance Selected</button></div></div>
  <div className="mt-4 grid grid-cols-1 gap-4">{reports.length===0&&<EmptyCard message="No matching reports. Try different filters."/>}{reports.map(r=>(<div key={r.id} className={`rounded-2xl border ${selection.includes(r.id)?"border-slate-900":"border-slate-200"}`}><div className="p-3 flex items-center justify-between"><label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={selection.includes(r.id)} onChange={()=>toggle(r.id)}/><span className="font-medium">{r.category}</span>{showPriority && <span className={`ml-2 text-xs px-2 py-0.5 rounded-full border ${badgeColor(r.priority)}`}>{r.priority}</span>}</label><span className="text-xs text-slate-500">{fmtDate(r.createdAt)}</span></div>{r.photo&&<img alt="report" src={r.photo} className="w-full h-40 object-cover"/>}<div className="p-3 space-y-2 text-sm"><p className="line-clamp-3">{r.description}</p><div className="flex items-center gap-2 text-slate-600"><MapPinIcon/> {r.coords.lat&&r.coords.lng?`${r.coords.lat}, ${r.coords.lng}`:"Location N/A"}</div><div className="flex items-center gap-2 text-slate-600"><ClockIcon/> {r.status}</div><div className="flex items-center gap-2 text-slate-600"><WrenchIcon/> Dept: {r.department}</div>{r.review&&(<div className="mt-1"><div className="text-slate-600 text-xs">Citizen rating:</div><StarsDisplay rating={r.review.rating}/>{r.review.comment&&<div className="text-xs text-slate-500 mt-1">“{r.review.comment}”</div>}</div>)}<div className="flex items-center gap-2"><label className="text-slate-600">Reassign:</label><select value={r.department} onChange={(e)=>assign(r.id,e.target.value)} className="border rounded-xl px-2 py-1">{Object.values(DEPARTMENTS).map(d=><option key={d} value={d}>{d}</option>)}</select>
    <div className="flex items-center gap-2">
          <button onClick={()=>deleteReport(r.id,setReports)} className="inline-flex items-center gap-1 text-red-600 hover:text-red-700 text-xs">
            <TrashIcon/> Delete
          </button>
          
          {/* Assign Technician button - only show if not already assigned */}
          {!r.assignedTechnician && r.status !== "Resolved" && (
            <button 
              onClick={() => assignTechnician(r)}
              className="inline-flex items-center gap-1 bg-blue-50 text-blue-600 hover:bg-blue-100 text-xs px-2 py-1 rounded-xl border border-blue-200"
            >
              <WrenchIcon/> Assign Technician
            </button>
          )}
          
          {/* Resolve & Notify button - only enabled when status is Pending Review */}
          {r.status === "Pending Review" ? (
            <button 
              onClick={()=>{
                setReports(prev=>prev.map(x=>x.id===r.id?
                  ({...x,status:'Resolved',updates:[...x.updates,{at:new Date().toISOString(),status:'Resolved',note:'Marked resolved by admin after technician completion'}]})
                  :x)); 
                pushNotification({
                  id:Date.now(),
                  reportId:r.id,
                  message:`Your report (${r.category}) has been reviewed and marked as resolved.`,
                  at:new Date().toISOString(),
                  reporter:r.reporter
                });
              }} 
              className="inline-flex items-center gap-1 bg-green-100 text-green-700 hover:bg-green-200 text-xs px-2 py-1 rounded-xl border border-green-200"
            >
              <CheckIcon/> Mark Resolved & Notify
            </button>
          ) : (
            r.status !== "Resolved" && (
              <span className="text-xs text-slate-500">
                {r.status === "In Progress" ? "Waiting for technician to complete work" : "Assign to technician first"}
              </span>
            )
          )}
        </div></div></div></div>))}</div></div>
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4"><h3 className="font-semibold mb-2">Hotspots (by volume)</h3><HotspotHeatlist reports={allReports}/></div></div>)}
    function ReportCard({r,onAdvance,onSaveReview}){
      const [showReview,setShowReview]=useState(false);
      const canReview=r.status==="Resolved";
      // Find the assigned technician's name from the updates
      const assignedUpdate = r.updates.find(u => u.status === "Assigned");
      const technicianName = assignedUpdate ? assignedUpdate.note.match(/assigned to technician (.*?) \(/)?.[1] : null;
      
      return(<div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        {r.photo&&<img alt="report" src={r.photo} className="w-full h-40 object-cover"/>}
        {r.completedPhoto && (
          <div className="p-3 pt-2">
            <div className="text-xs text-slate-500 mb-1">Completed Photo</div>
            <img src={r.completedPhoto} alt="Completed work" className="w-full h-40 object-cover rounded" />
          </div>
        )}
        <div className="p-3 space-y-2 text-sm">
          <div className="flex items-center justify-between">
            <span className="font-medium">{r.category}</span>
            <span className={`text-xs px-2 py-0.5 rounded-full border ${badgeColor(r.priority)}`}>{r.priority}</span>
          </div>
          <p className="line-clamp-3">{r.description}</p>
          <div className="flex items-center gap-2 text-slate-600">
            <MapPinIcon/> {r.coords.lat&&r.coords.lng?`${r.coords.lat}, ${r.coords.lng}`:"Location N/A"}
          </div>
          <div className="flex items-center gap-2 text-slate-600">
            <ClockIcon/> {r.status}
          </div>
          <div className="text-xs text-slate-500">{fmtDate(r.createdAt)} • Dept: {r.department}</div>
          {technicianName && (
            <div className="flex items-center gap-2 text-slate-600">
              <WrenchIcon/> Assigned to: {technicianName}
            </div>
          )}<div className="pt-1 flex flex-wrap gap-2"><button onClick={onAdvance} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border"><WrenchIcon/> Advance status</button>{canReview&&!r.review&&(<button onClick={()=>setShowReview(v=>!v)} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border">Rate Resolution</button>)}</div>{canReview&&!r.review&&showReview&&(<ReviewForm onCancel={()=>setShowReview(false)} onSave={(rating,comment)=>{onSaveReview(r.id,rating,comment);setShowReview(false)}}/>)}
      {r.review&&(<div className="mt-2 border rounded-xl p-2"><div className="text-slate-600 text-xs mb-1">Your Review</div><StarsDisplay rating={r.review.rating}/>{r.review.comment&&<div className="text-xs text-slate-600 mt-1">“{r.review.comment}”</div>}</div>)}</div></div>)}
    function ReviewForm({onSave,onCancel}){const [rating,setRating]=useState(0);const [hover,setHover]=useState(0);const [comment,setComment]=useState("");return(<div className="mt-2 border rounded-xl p-3 bg-slate-50"><div className="text-sm font-medium mb-2">Rate the resolution</div><div className="flex items-center gap-1 mb-2">{[1,2,3,4,5].map(n=>(<button key={n} type="button" onMouseEnter={()=>setHover(n)} onMouseLeave={()=>setHover(0)} onClick={()=>setRating(n)} className={`p-1 ${(hover||rating)>=n?'text-amber-500':'text-slate-400'}`} aria-label={`${n} star`}><StarIcon filled={(hover||rating)>=n}/></button>))}<span className="text-xs text-slate-600 ml-2">{rating?`${rating}/5`:"Select rating"}</span></div><textarea value={comment} onChange={(e)=>setComment(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm" placeholder="Optional feedback (what was good / what to improve)"/><div className="mt-2 flex gap-2"><button disabled={!rating} onClick={()=>onSave(rating,comment.trim())} className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-sm">Submit</button><button onClick={onCancel} className="px-3 py-1.5 rounded-xl border text-sm">Cancel</button></div></div>)}
    function StarsDisplay({rating}){return(<div className="flex items-center gap-0.5 text-amber-500">{[1,2,3,4,5].map(n=><StarIcon key={n} filled={n<=rating}/>)}</div>)}
    function FilterSelect({label,value,onChange,options}){return(<label className="text-sm flex items-center gap-2"><span className="text-slate-600">{label}</span><select value={value} onChange={(e)=>onChange(e.target.value)} className="border rounded-xl px-2 py-1">{options.map(o=><option key={o} value={o}>{o||"All"}</option>)}</select></label>)}
    function StatCard({title,value,icon}){return(<div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4"><div className="flex items-center gap-2 text-slate-600 text-sm">{icon} {title}</div><div className="text-2xl font-semibold mt-1">{value}</div></div>)}
    function EmptyCard({message}){return <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center text-slate-500">{message}</div>}
    function HotspotHeatlist({reports}){const buckets={};reports.forEach(r=>{const key=(r.coords.lat&&r.coords.lng)?`${Number(r.coords.lat).toFixed(3)},${Number(r.coords.lng).toFixed(3)}`:"Unspecified";buckets[key]=(buckets[key]||0)+1});const items=Object.entries(buckets).sort((a,b)=>b[1]-a[1]).slice(0,8);return(<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">{items.map(([k,v])=>(<div key={k} className="border rounded-xl p-3 flex items-center justify-between"><div className="flex items-center gap-2 text-slate-600"><MapPinIcon/> {k}</div><div className="text-slate-900 font-semibold">{v}</div></div>))}</div>)}
    function deleteReport(id,setReports){setReports(prev=>prev.filter(r=>r.id!==id))}
    function GovIdUploader({onSave}){
      const [file,setFile]=useState(null);
      const [preview,setPreview]=useState(null);
      useEffect(()=>{if(!file){setPreview(null);return}const fr=new FileReader();fr.onload=()=>setPreview(fr.result);fr.readAsDataURL(file)},[file]);
      return(
        <div className="space-y-3">
          <div className="flex items-center justify-center">
            <label className="inline-flex flex-col items-center px-4 py-2 bg-slate-50 rounded-xl border cursor-pointer">
              <div className="text-sm text-slate-600">Click to select image</div>
              <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e)=>setFile(e.target.files?.[0]||null)}/>
            </label>
          </div>
          {preview&&(
            <div className="flex items-center justify-center">
              <img src={preview} alt="preview" className="w-48 h-28 object-cover rounded-md border"/>
            </div>
          )}
          <div className="flex items-center gap-2 justify-center">
            <button onClick={()=>{if(!preview){alert('Please select an image first');return}onSave(preview)}} className="px-4 py-2 rounded-xl bg-blue-700 text-white">Save ID</button>
          </div>
        </div>
      )
    }
    
      // Simple rule-based chatbot for public guidance
      function ChatWidget({publicProfile}){
        const [open,setOpen]=useState(false);
        const [messages,setMessages]=useState([{
          from:'bot',
          text: 'Hello! I can help you file a report, check status, or explain how this demo works. Try: "How do I report?" or "Check my report status".'
        }]);
        const [input,setInput]=useState('');
        const scrollRef = useRef();

        // FAQ / knowledge base for the bot
        const FAQ = [
          {q: 'How do I submit a report?', a: 'Open Report → choose a category → add description & photo → submit. The system auto‑routes to the responsible department.'},
          {q: 'What is Aadhaar used for?', a: 'Aadhaar (12 digits) is used in this demo to identify public users locally. No external API is called.'},
          {q: 'How are technicians assigned?', a: 'Technicians are assigned automatically when available; admins may assign manually. Statuses: Assigned → In Progress → Pending Review → Resolved.'},
          {q: 'Is this an official site?', a: 'No — this is a demo prototype. Data is stored locally in your browser unless connected to an API.'},
          {q: 'How do I check my report status?', a: 'Click My Reports in the top navigation (or ask me to open it). Reports you submitted in this browser will appear there.'}
        ];

        useEffect(()=>{ if(open){ setTimeout(()=>{ scrollRef.current?.scrollTo({top: scrollRef.current.scrollHeight, behavior:'smooth'}) },100) } },[messages,open]);

        function pushUser(text){
          if(!text||!text.trim())return;
          const t = text.trim();
          setMessages(prev=>[...prev,{from:'user',text:t}]);
          setInput('');
          // simple bot reply after delay with more helpful mappings
          setTimeout(()=>{
            const low = t.toLowerCase();
            let reply = "Sorry, I didn't understand. Try: 'How do I report?', 'Check my status', or use one of the quick buttons.";
            if(low.includes('how') && low.includes('report')){
              reply = 'To report: click "Report" → choose category → add description & photo → submit. The system will auto‑assign a department.';
              // suggest opening report form
              dispatchSystemEvent({type:'open-report'});
            } else if(low.includes('status') || low.includes('check')){
              reply = 'To check status: open "My Reports" (top nav) — you will see all reports you submitted in this browser.';
              dispatchSystemEvent({type:'open-my-reports'});
            } else if(low.includes('aadhaar')||low.includes('aadhar')){
              reply = 'Public login uses a 12‑digit Aadhaar number. Enter it on Public Login to save your profile locally for the demo.';
            } else if(low.includes('technician')||low.includes('assign')){
              reply = 'Technicians are assigned automatically when available or can be assigned by an admin. Statuses: Assigned → In Progress → Pending Review → Resolved.';
            } else if(low.includes('contact')||low.includes('phone')){
              reply = 'You can optionally add your phone when saving your profile — used only for demo identification.';
            } else if(low.includes('help')||low.includes('guide')){
              reply = 'I can guide you through the public flows: logging in, filing a report, and viewing your reports. Try the Quick actions below.';
            }
            setMessages(prev=>[...prev,{from:'bot',text:reply}]);
          }, 500);
        }

        return (
          <div className="fixed right-4 bottom-4 z-50">
            {!open && (
              <button onClick={()=>setOpen(true)} aria-label="Open chat" className="w-14 h-14 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5" aria-hidden>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
                  <path strokeLinecap="round" strokeLinejoin="round" d="M8 10h.01M12 10h.01M16 10h.01" />
                </svg>
              </button>
            )}
            {open && (
              <div className="w-80 sm:w-96 bg-white rounded-2xl shadow-xl border overflow-hidden">
                <div className="flex items-center justify-between px-3 py-2 bg-blue-600 text-white">
                  <div className="font-semibold">Public Assistant</div>
                  <div className="flex items-center gap-2">
                    <button onClick={()=>{ setOpen(false) }} className="px-2 py-1 rounded bg-white/10">Close</button>
                  </div>
                </div>
                <div className="p-3 bg-slate-50">
                  <div className="mb-2 text-xs text-slate-500">Quick help</div>
                  <div className="flex flex-wrap gap-2 mb-3">
                    {FAQ.slice(0,3).map((f,idx)=>(
                      <button key={idx} onClick={()=>{ setMessages(prev=>[...prev,{from:'user',text:f.q}]); setTimeout(()=>setMessages(prev=>[...prev,{from:'bot',text:f.a}]),250); }} className="px-3 py-1.5 rounded-full bg-white border text-slate-700 text-xs">{f.q}</button>
                    ))}
                  </div>
                  <div ref={scrollRef} className="h-56 overflow-y-auto p-1 space-y-2">
                    {messages.map((m,i)=>(
                      <div key={i} className={`flex ${m.from==='bot'?'justify-start':'justify-end'}`}>
                        <div className={`max-w-[80%] px-3 py-2 rounded-xl ${m.from==='bot'?'bg-white border':'bg-blue-600 text-white'}`}>
                          {m.text}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="mt-3 flex flex-wrap gap-2">
                    <button onClick={()=>{ pushUser('How do I report?') }} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs">How to report</button>
                    <button onClick={()=>{ pushUser('Check my status') }} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs">Check status</button>
                    <button onClick={()=>{ pushUser('Aadhaar info') }} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs">Aadhaar</button>
                    <button onClick={()=>{ dispatchSystemEvent({type:'open-report'}) }} className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs">Open Report form</button>
                    <button onClick={()=>{ dispatchSystemEvent({type:'open-my-reports'}) }} className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs">Open My Reports</button>
                  </div>
                </div>
                <div className="p-2 bg-white border-t flex gap-2">
                  <input value={input} onChange={(e)=>setInput(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter'){ pushUser(input) } }} placeholder="Ask me (e.g., how to report)" className="flex-1 px-3 py-2 rounded-xl border" />
                  <button onClick={()=>pushUser(input)} className="px-3 py-2 rounded-xl bg-blue-600 text-white">Send</button>
                </div>
              </div>
            )}
          </div>
        );
      }
    const root=ReactDOM.createRoot(document.getElementById("root")); root.render(<App/>);
  </script>
</body>
</html>
